name: LPR-0 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lpr0-ci-${{ github.ref }}
  cancel-in-progress: true

# WU-RP-005 r5: ALL jobs run in parallel (no `needs` chain). The previous
# serial chain (compile -> domain/arch -> application) made CI wall time the
# SUM of stages (~20 min). Now it is the MAX of parallel jobs (~4-6 min).
# application-focused is sharded 4-ways by test-class prefix so each shard
# finishes well inside the hosted-runner preemption window.

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/wrapper-validation-action@ebf3e6cb8f1ba19fc037a72116fe64f24046d72c # v3
      - name: L0 — compile main + test sources
        run: cd v2 && ./gradlew compileKotlin compileTestKotlin --no-daemon
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lpr0-compile-logs
          path: v2/**/build/reports/problems/

  domain-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/wrapper-validation-action@ebf3e6cb8f1ba19fc037a72116fe64f24046d72c # v3
      - name: L1 — domain unit tests
        run: cd v2 && ./gradlew :pipeline-domain:test --no-daemon
      - name: L1 — events tests
        run: cd v2 && ./gradlew :pipeline-events:test --no-daemon
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lpr0-domain-test-reports
          path: v2/**/build/test-results/test/

  architecture-fitness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/wrapper-validation-action@ebf3e6cb8f1ba19fc037a72116fe64f24046d72c # v3
      - name: L2 — architecture fitness tests
        run: cd v2 && ./gradlew :pipeline-architecture-tests:test --no-daemon
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lpr0-arch-test-reports
          path: v2/**/build/test-results/test/

  application-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: uat-local
            include: "dev.rubentxu.pipeline.v2.application.UatLocal*"
          - name: uat-dsl
            include: "dev.rubentxu.pipeline.v2.application.UatDsl*"
          - name: uat-core
            include: "dev.rubentxu.pipeline.v2.application.UatStep*,dev.rubentxu.pipeline.v2.application.UatEvt*,dev.rubentxu.pipeline.v2.application.UatCompat*"
          - name: engine
            # WU-RP-005 r6: Gradle `--tests '!X'` negation is silently ignored
            # (same class of bug as r3), so the engine shard previously DUPLICATED
            # the UatLocal classes. Exclusion now flows through -Pshard.excludes
            # into useJUnitPlatform { excludeTestsMatching } (build.gradle.kts).
            include: "dev.rubentxu.pipeline.v2.application.*"
            exclude: "dev.rubentxu.pipeline.v2.application.Uat*"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # CP-001 (UatLocal005CorpusUntouchedTest) needs `git show base^`:
          # shallow clones break it. Full history for all shards is cheap here
          # and keeps every job identical.
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/wrapper-validation-action@ebf3e6cb8f1ba19fc037a72116fe64f24046d72c # v3
      - name: "Install just (UatLocal010 SC-010-09 uses `just doctor`)"
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
          just --version
      - name: "Gradle cache (WU-RP-005 - warm scripting/compile cache)"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-lpr0-${{ hashFiles('v2/**/build.gradle.kts', 'v2/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-lpr0-
      - name: "L3 - application shard ${{ matrix.shard.name }}"
        run: |
          cd v2
          ARGS=""
          IFS=',' read -ra PATTERNS <<< "${{ matrix.shard.include }}"
          for p in "${PATTERNS[@]}"; do
            ARGS="$ARGS --tests '$p'"
          done
          EXCL="${{ matrix.shard.exclude || '' }}"
          if [ -n "$EXCL" ]; then
            # Quote each pattern; Gradle test filter excludes are passed as
            # -Pshard.excludes and consumed by useJUnitPlatform (r6).
            IFS=',' read -ra EP <<< "$EXCL"
            EQ=""
            for e in "${EP[@]}"; do EQ="$EQ'$e',"; done
            ARGS="$ARGS -Pshard.excludes=${EQ%,}"
          fi
          eval ./gradlew :pipeline-application:test -PexcludeSlowTests=true $ARGS --no-daemon
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lpr0-app-shard-${{ matrix.shard.name }}-reports
          path: v2/**/build/test-results/test/

  # NOTE: a nightly compatibility-corpus job is intentionally omitted from this
  # LPR-0 baseline. Compatibility tests run only when explicitly invoked (manual
  # `workflow_dispatch` extension or from a local just gate). Adding the nightly
  # cron happens in a later work unit once WU-LPR-001..003 reduce the
  # compatibility fixture failures below the noise floor.
