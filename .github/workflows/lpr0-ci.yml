name: LPR-0 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lpr0-ci-${{ github.ref }}
  cancel-in-progress: true

# WU-RP-005 r5: ALL jobs run in parallel (no `needs` chain). The previous
# serial chain (compile -> domain/arch -> application) made CI wall time the
# SUM of stages (~20 min). Now it is the MAX of parallel jobs (~4-6 min).
# application-focused is sharded 4-ways by test-class prefix so each shard
# finishes well inside the hosted-runner preemption window.

jobs:
  compile:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/wrapper-validation-action@ebf3e6cb8f1ba19fc037a72116fe64f24046d72c # v3
      - name: L0 — compile main + test sources
        run: cd v2 && ./gradlew compileKotlin compileTestKotlin --no-daemon
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lpr0-compile-logs
          path: v2/**/build/reports/problems/

  domain-unit:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/wrapper-validation-action@ebf3e6cb8f1ba19fc037a72116fe64f24046d72c # v3
      - name: L1 — domain unit tests
        run: cd v2 && ./gradlew :pipeline-domain:test --no-daemon
      - name: L1 — events tests
        run: cd v2 && ./gradlew :pipeline-events:test --no-daemon
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lpr0-domain-test-reports
          path: v2/**/build/test-results/test/

  architecture-fitness:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/wrapper-validation-action@ebf3e6cb8f1ba19fc037a72116fe64f24046d72c # v3
      - name: L2 — architecture fitness tests
        run: cd v2 && ./gradlew :pipeline-architecture-tests:test --no-daemon
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lpr0-arch-test-reports
          path: v2/**/build/test-results/test/

  application-shard:
    runs-on: self-hosted
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: uat-local
            include: "dev.rubentxu.pipeline.v2.application.UatLocal*"
          - name: uat-dsl
            include: "dev.rubentxu.pipeline.v2.application.UatDsl*"
          - name: uat-core
            include: "dev.rubentxu.pipeline.v2.application.UatStep*,dev.rubentxu.pipeline.v2.application.UatEvt*,dev.rubentxu.pipeline.v2.application.UatCompat*"
          - name: engine
            # WU-RP-005 r6: Gradle `--tests '!X'` negation is silently ignored
            # (same class of bug as r3), so the engine shard previously DUPLICATED
            # the UatLocal classes. Exclusion now flows through -Pshard.excludes
            # into useJUnitPlatform { excludeTestsMatching } (build.gradle.kts).
            include: "dev.rubentxu.pipeline.v2.application.*"
            exclude: "dev.rubentxu.pipeline.v2.application.Uat*"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # CP-001 (UatLocal005CorpusUntouchedTest) needs `git show base^`:
          # shallow clones break it. Full history for all shards is cheap here
          # and keeps every job identical.
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/wrapper-validation-action@ebf3e6cb8f1ba19fc037a72116fe64f24046d72c # v3
      - name: "Install just (UatLocal010 SC-010-09 uses `just doctor`)"
        # WU-RP-051: hardened against transient HTTP 403 from just.systems
        # (observed 2026-09-23 in CI re-run). Tries up to 3 times with
        # backoff, then falls back to apt-install (Ubuntu 22.04+ ships it).
        run: |
          for i in 1 2 3; do
            if curl --proto '=https' --tlsv1.2 -sSf -o /tmp/just-install.sh \
                https://just.systems/install.sh && \
               bash /tmp/just-install.sh --to /usr/local/bin && \
               just --version; then
              echo "just installed via official installer (attempt $i)"
              exit 0
            fi
            echo "just.systems install attempt $i failed; retrying in $((i*5))s"
            sleep $((i*5))
          done
          echo "Falling back to apt-install for just"
          sudo apt-get update -qq && sudo apt-get install -y -qq just
          just --version
      - name: "Gradle cache (WU-RP-005 - warm scripting/compile cache)"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-lpr0-${{ hashFiles('v2/**/build.gradle.kts', 'v2/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-lpr0-
      - name: "L3 - application shard ${{ matrix.shard.name }}"
        run: |
          cd v2
          ARGS=""
          IFS=',' read -ra PATTERNS <<< "${{ matrix.shard.include }}"
          for p in "${PATTERNS[@]}"; do
            ARGS="$ARGS --tests '$p'"
          done
          EXCL="${{ matrix.shard.exclude || '' }}"
          if [ -n "$EXCL" ]; then
            # Quote each pattern; Gradle test filter excludes are passed as
            # -Pshard.excludes and consumed by useJUnitPlatform (r6).
            IFS=',' read -ra EP <<< "$EXCL"
            EQ=""
            for e in "${EP[@]}"; do EQ="$EQ'$e',"; done
            ARGS="$ARGS -Pshard.excludes=${EQ%,}"
          fi
          eval ./gradlew :pipeline-application:test -PexcludeSlowTests=true $ARGS --no-daemon
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lpr0-app-shard-${{ matrix.shard.name }}-reports
          path: v2/**/build/test-results/test/

  # NOTE: a nightly compatibility-corpus job is intentionally omitted from this
  # LPR-0 baseline. Compatibility tests run only when explicitly invoked (manual
  # `workflow_dispatch` extension or from a local just gate). Adding the nightly
  # cron happens in a later work unit once WU-LPR-001..003 reduce the
  # compatibility fixture failures below the noise floor.

  # WU-RP-040 R3: supply-chain quality gates (secret scan + SBOM).
  # Kept in the same workflow so the required checks stay one unit; both jobs are
  # fast and independent of the Gradle shards.
  secret-scan:
    name: secret-scan (gitleaks)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Self-hosted runners share $HOME: give each job a private download
          # dir so concurrent gitleaks installs don't race on gitleaks.tmp.
          GITLEAKS_INSTALL_DIR: ${{ runner.temp }}/gitleaks-install


  # ─────────────────────────────────────────────────────────────────────────
  # WU-RP-043 — Self-hosted CI / progressive dogfooding (N2 + N3).
  #
  # N1 bootstrap independence: this job checks out and builds pipelinek from a
  # clean checkout with only checkout+JDK+Gradle steps (no dependence on the
  # DSL/registry/executor under test — those are exercised BY the build).
  # If the engine is broken, `installDist` itself fails here, independent of
  # every other job.
  #
  # N2 dogfooding: the pipelinek binary built from THIS SHA executes a real
  # `.pipeline.kts` from the repository. Success path (corpus 01-basic) must
  # exit 0; intentional-failure path (ci/dogfood-fail.pipeline.kts) must exit
  # non-zero — criterion (d): a deliberate failure turns CI red, proving the
  # runner actually executes rather than silently passing.
  #
  # N3 external verification: artifacts (events jsonl + logs) are verified from
  # OUTSIDE the engine with jq — event stream shape (CompilationStarted →
  # RunFinished), outcome fields, run identity — not by trusting pipelinek's
  # own exit code alone.
  #
  # GitHub Actions remains only launcher/publisher; pipelinek defines and runs
  # the CI logic (ROADMAP RP-4, WU-RP-043 charter).
  # ─────────────────────────────────────────────────────────────────────────
  dogfood:
    name: dogfood (pipelinek runs .pipeline.kts of same SHA)
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/wrapper-validation-action@ebf3e6cb8f1ba19fc037a72116fe64f24046d72c # v3
      - name: N1 — bootstrap build from clean checkout
        run: cd v2 && ./gradlew :pipeline-application:installDist --no-daemon
      - name: N2 success path — pipelinek executes repo .pipeline.kts (must exit 0)
        run: |
          PK=v2/pipeline-application/build/install/pipelinek/bin/pipelinek
          rm -rf /tmp/dogfood-ok-ctl
          $PK run \
            --db /tmp/dogfood-ok.sqlite \
            --control-root /tmp/dogfood-ok-ctl \
            --workspace . \
            v2/compatibility/01-basic.pipeline.kts \
            > /tmp/dogfood-ok.events.jsonl 2> /tmp/dogfood-ok.stderr.log
          echo "pipelinek exit=$? (set -e guarantees non-zero fails the job)"
      - name: N2 failure path — intentional failure must turn CI red
        run: |
          PK=v2/pipeline-application/build/install/pipelinek/bin/pipelinek
          rm -rf /tmp/dogfood-fail-ctl
          set +e
          $PK run \
            --db /tmp/dogfood-fail.sqlite \
            --control-root /tmp/dogfood-fail-ctl \
            --workspace . \
            ci/dogfood-fail.pipeline.kts \
            > /tmp/dogfood-fail.events.jsonl 2> /tmp/dogfood-fail.stderr.log
          CODE=$?
          set -e
          echo "intentional-failure exit=$CODE"
          if [ "$CODE" -eq 0 ]; then
            echo "::error::WU-RP-043(d): intentional-failure script exited 0 — the red path is broken"
            exit 1
          fi
          echo "red path OK: non-zero exit as required"
      - name: N3 — verify outcomes from OUTSIDE the engine (jq over events jsonl)
        run: |
          set -euo pipefail
          # Success run: first event must be CompilationStarted (stdout is a
          # single JSON array of events), last must be RunFinished success.
          jq -e '.[0].kind == "CompilationStarted"' /tmp/dogfood-ok.events.jsonl > /dev/null
          jq -e '.[-1].kind == "RunFinished" and .[-1].outcome == "success"' /tmp/dogfood-ok.events.jsonl > /dev/null
          # The success script's echo step must be observable in the stream.
          jq -e 'map(select(.kind == "StepFinished" and .stepName == "hello/echo-0")) | length > 0' /tmp/dogfood-ok.events.jsonl > /dev/null
          # Failure run: RunFinished outcome failure AND a typed StepFailed.
          jq -e '.[-1].kind == "RunFinished" and .[-1].outcome == "failure"' /tmp/dogfood-fail.events.jsonl > /dev/null
          jq -e 'map(select(.kind == "StepFailed" and .failureKind == "SCRIPT")) | length > 0' /tmp/dogfood-fail.events.jsonl > /dev/null
          echo "N3 external verification PASS (success + failure streams well-formed)"
      - name: N3 — publish events as CI artifacts (external inspection)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dogfood-events
          path: |
            /tmp/dogfood-ok.events.jsonl
            /tmp/dogfood-fail.events.jsonl
            /tmp/dogfood-ok.stderr.log
            /tmp/dogfood-fail.stderr.log

  sast:
    name: sast (detekt)
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/wrapper-validation-action@ebf3e6cb8f1ba19fc037a72116fe64f24046d72c # v3
      - name: "Gradle cache (WU-RP-005 - warm scripting/compile cache)"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-lpr0-sast-${{ hashFiles('v2/**/build.gradle.kts', 'v2/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-lpr0-sast-
      # WU-RP-040 R5: SAST gate. detekt runs over the curated rule subset in
      # v2/config/detekt/detekt.yml with per-module baselines frozen at the
      # 2026-09-23 debt snapshot (HEAD 6f7c445f). Ratchet semantics: the job
      # fails on ANY new finding. Reports are uploaded as per-run evidence.
      - name: detekt (all Kotlin modules, baseline ratchet)
        run: cd v2 && ./gradlew detekt --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sast-detekt-reports
          path: v2/**/build/reports/detekt/

  sbom:
    name: sbom (cyclonedx)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/wrapper-validation-action@ebf3e6cb8f1ba19fc037a72116fe64f24046d72c # v3
      # WU-RP-051-bis: sbom job was missing the gradle cache step that all
      # other jobs use, so on 2026-09-23 it hit Maven Central cold and was
      # rejected with HTTP 403 (rate-limit / anti-bot). Add the same cache
      # step the application-shards use to avoid cold downloads.
      - name: "Gradle cache (WU-RP-005 - warm scripting/compile cache)"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-lpr0-sbom-${{ hashFiles('v2/**/build.gradle.kts', 'v2/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-lpr0-sbom-
      - name: Generate CycloneDX SBOM
        run: cd v2 && ./gradlew -q :pipeline-application:cyclonedxBom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: |
            v2/pipeline-application/build/reports/bom.json
            v2/pipeline-application/build/reports/bom.xml
