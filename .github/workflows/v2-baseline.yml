name: V2 Baseline CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: v2-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v2-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3
      - run: cd v2 && ./gradlew check
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v2-test-reports
          path: v2/**/build/reports/tests/test/
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v2-test-results
          path: v2/**/build/test-results/test/
