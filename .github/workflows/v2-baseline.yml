name: V2 Baseline CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: v2-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v2-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v4
      - uses: actions/setup-java@e9fbacdec3bb3b6036605a3e6f7995d66773a8c6 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/wrapper-validation-action@ebf3e6cb8f1ba19fc037a72116fe64f24046d72c # v3
      - run: cd v2 && ./gradlew check
      - if: failure()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v4
        with:
          name: v2-test-reports
          path: v2/**/build/reports/tests/test/
      - if: failure()
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v4
        with:
          name: v2-test-results
          path: v2/**/build/test-results/test/
