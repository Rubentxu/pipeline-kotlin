name: V2 Baseline CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: v2-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v2-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/wrapper-validation-action@ebf3e6cb8f1ba19fc037a72116fe64f24046d72c # v3
      - run: cd v2 && ./gradlew check
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v2-test-reports
          path: v2/**/build/reports/tests/test/
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v2-test-results
          path: v2/**/build/test-results/test/
