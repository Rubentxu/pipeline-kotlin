# .gitleaks.toml — política del proyecto
# Política de gitleaks para el repositorio pipeline-kotlin.
#
# Este archivo es detectado automáticamente por gitleaks/gitleaks-action
# y por la CLI gitleaks 8.x.
#
# La lista [allowlist] está VACÍA a propósito. Hasta el RESET de testing
# contenía diez rutas: ocho fixtures bajo `src/test/` que imprimían canarios de alta
# entropía o claves PEM para verificar el redactor y el ciclo de credenciales,
# un recurso `core/src/test/resources/secretResolver/secret.key` del V1 ya
# retirado, y un documento de evidencia bajo `docs/v2/07-uat/`. Todas elas
# desaparecieron con la demolición del testing RESET: `pipelinek/**/src/test` contiene
# hoy solo fuentes de test unitario, ningún fixture; no existe `core/`, y el árbol
# `docs/` ya no está versionado.
#
# Se conservan vacías y no se borra el fichero por dos razones. La primera es
# que una supresión que nombra un fichero inexistente es inerte pero engaña:
# documenta una garantía de exclusión que ya no cubre nada. La segunda es que
# este archivo ES la política: quien lo borrara perdería el punto de declaración,
# y las allowlists de este tipo deben crecer cuando aparezca un canario nuevo,
# no reaparecer por sorpresa.
#
# Regla que sigue vigente: ningún path listado aquí contendría credenciales
# reales. Los fixtures imprimen strings de ALTA ENTROPÍA o PEM-like con un
# propósito explícito de verificar el redactor. Si se añade por error una
# credencial real al repo, debe salir de la lista y rotarse de inmediato.

[allowlist]
paths = []