    notes: |
      CORE-LOAD-REJECTED (2026-09-17). Five converging signals: (1) legacy
      CanonicalLoadNodeDispatcher was a silent no-op (reads file, emits
      WorkflowLoaded stepCount=0, returns Success — does NOT execute child
      pipeline); (2) latent contract defect: DSL `load(path)` →
      OpaqueStepNode("core.load") with no path in canonical envelope → fails
      closed at decode; (3) UatLocal011WorkflowControlTest::SC-011-11 was
      @Disabled (INC-024, pre-existing); (4) zero load(...) usage in
      v2/compatibility/; (5) SPIKE-018 §1.3 declares core.load the LAST
      legacy lift requiring new infrastructure (SCRIPT_COMPILATION_CAPABILITY
      + BODY_INVOKER_CAPABILITY) out of LFC-2 scope.

      Directive explicitly forbids "handler → compiler arbitrario → execute
      child pipeline como segundo execution engine". The DSL `load(path)`
      function and `StepSpec.Load` subtype are physically removed. No
      compatibility fixture exercises it. Future "load child pipeline"
      capability, if required, is LFC-3+ design item requiring new typed
      input/output carriers, new capabilities, new events
      (ChildPipelineStarted, ChildPipelineFinished), and a registry
      StepDefinition.

