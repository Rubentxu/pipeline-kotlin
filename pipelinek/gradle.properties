# V2 build performance (AGENTS.md V2 TESTING RULES, rule 6)
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# The sealed PipelineK runtime the tree's own builds resolve when no
# PIPELINEK_BUNDLE is in the environment. The seal carries the verbs the
# fabric worker's supervisor invokes (`substrate init`, `serve`); a seal
# older than 0.97.0 dies at SubstrateNotPrepared on the first
# service-required run. The environment precedes this property.
PIPELINEK_BUNDLE=/var/home/rubentxu/.local/state/pipelinek-seals/0.97.0-escaper-fix
