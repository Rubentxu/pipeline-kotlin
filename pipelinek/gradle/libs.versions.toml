[versions]
kotlin = "2.4.10"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
opentelemetry = "1.67.0"
# The OFFICIAL protobuf-generated OTLP model. It is NOT part of the OpenTelemetry
# BOM and NOT part of any published artifact of this product: it exists so the
# TESTS can decode, with an official decoder, what the historical export
# writes. The version is pinned here because nothing else manages it.
opentelemetryProto = "1.11.1-alpha"
# The protobuf runtime that model is generated against. The official OTLP model
# is a FILE FORMAT plus an ENGINE: this project does not own either, and
# reimplementing a protobuf decoder to check our own output would be a second
# understanding of the format rather than a check of it.
protobufJava = "4.36.2"
junit = "5.11.4"
junitLauncher = "1.11.4"
cyclonedx = "1.8.2"

# BouncyCastle (credentials-local module only)
# NOTE: bcprov-jdk18on is the correct artifact (NOT bcprov-jdk21on which does not exist)
# 1.86: clears GHSA-wg6q-6289-32hp (bcpkix CompositeVerifier, fixed 1.84) and the three
# bcprov advisories osv-scanner flagged against 1.80.2; 1.86 is the hardening release.
bouncycastle = "1.86"
snakeyaml = "2.3"
# binary-compatibility-validator captures the JVM ABI of public Kotlin types.
# The modules whose ABI is frozen are listed in the root build script, and each
# of them runs `apiCheck` as part of its own `check`, so the aggregate gate
# refuses an unannounced change to a published surface.
# 0.18.2 supports Kotlin 2.4.x metadata.
binaryCompatibilityValidator = "0.18.2"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version = "3.46.1.3" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk" }
opentelemetry-sdk-autoconfigure = { module = "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
# The marshalers that WRITE the OTLP wire format. They arrive with the OTLP
# exporter above, so this line declares what the product already uses instead of
# adding a byte to the distribution: the historical export writes the same
# format with the same encoder the live exporter uses, instead of a second
# hand-written encoder of its own.
opentelemetry-exporter-otlp-common = { module = "io.opentelemetry:opentelemetry-exporter-otlp-common" }
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing" }
# FOR THE TESTS ALONE. The official protobuf-generated OTLP model, and the protobuf
# runtime it is generated against: together they are the official decoder that
# reads back what the historical export writes. Neither ships in the
# distribution, and neither is reachable from any published artifact.
opentelemetry-proto = { module = "io.opentelemetry.proto:opentelemetry-proto", version.ref = "opentelemetryProto" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobufJava" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitLauncher" }
kotlin-scripting-jvm-host = { module = "org.jetbrains.kotlin:kotlin-scripting-jvm-host", version.ref = "kotlin" }
kotlin-scripting-jvm = { module = "org.jetbrains.kotlin:kotlin-scripting-jvm", version.ref = "kotlin" }
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
# BouncyCastle (credentials-local module only)
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }

[bundles]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinxSerialization" }
# SAST (detekt). 2.0.0-alpha.6 is built against Kotlin 2.4.10 (same as this
# toolchain); 1.23.x cannot parse class-file major 68 (JDK24) — precedent: pitest 1.15 -> 1.19.
detekt = { id = "dev.detekt", version = "2.0.0-alpha.6" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
# ABI baseline capture. See version note above.
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
