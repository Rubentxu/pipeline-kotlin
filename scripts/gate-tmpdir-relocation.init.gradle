// The temporaries of the workers that run the tests, relocated with the run.
//
// The gate relocates the temporaries of the PROCESS it runs: it exports
// JAVA_OPTS with -Djava.io.tmpdir pointing at the cycle's own directory, and
// the product's JVM, the CLI the scenarios launch and the compiler daemon all
// inherit it.
//
// The workers Gradle forks to execute the tests do not. They are launched
// with their own arguments and the property the client was given is not among
// them. Measured, with the client writing into the run's own directory: four
// `shoptions-shared*` directories appeared in the shared temporary directory
// of the machine during `:pipeline-step-sdk:runtime:test`, one per worker.
//
// That gap is what made the residue census blind. A temporary in the shared
// directory has no owner: the census of that directory can report the names
// but cannot attribute them, so the leak produced by the very tests that
// guard the product could not be told apart from another program's leak --
// and the run stayed green with the leak in it.
//
// Relocating the workers closes the gap. What they leave lands in the run's
// own directory, where the owner is known, so the residue is the run's debt
// and the census can say so.
//
// WHY THE DESTINATION IS READ WHEN THE TEST RUNS, AND NOT WHEN IT IS
// CONFIGURED
//
// The obvious way to relocate a worker is to set the property while the task
// is configured. That is wrong the moment the build is allowed to reuse a
// configuration cache entry, and the reason is about the OWNERSHIP of the
// directory.
//
// The gate gives every run its own cycle directory, and it deletes that
// directory when the run ends. A configuration cache entry, on the other hand,
// outlives the run that stored it: it is written by one run and read by the
// NEXT one. A property set at configuration time is therefore FROZEN IN THE
// ENTRY with the directory of the run that stored it, and the next run --
// which has a directory of its own -- would send its workers to a directory
// that no longer exists: the workers would write outside the census, or fail
// to write at all, and the census of the run would be blind again for the
// same reason it was blind before.
//
// So the property is set in an action that runs WHEN THE TEST RUNS. The
// action reads the environment at that moment, so it always sees the
// directory of the run that is executing right now, whether that run
// configured the build or reused an entry. The configured value of the
// property is a fixed point of the configuration, and the action overrides
// it just before the workers are forked.
//
// The action is attached to the task when it is configured, but the
// environment it reads is not read until it runs: the two moments are
// different, and only the second one knows which run is executing.
//
// WHY THE ENVIRONMENT IS NOT READ AT CONFIGURATION TIME EITHER
//
// An earlier version of this script read the environment at configuration
// time, to find out whether the gate was driving the build at all. Measured
// on this build (Gradle 8.14.5), that read is not free: Gradle RECORDS the
// environment variables a build reads while it configures, and the recorded
// values become part of the identity of the configuration cache entry. The
// gate gives every run a directory of its own, so the recorded value differs
// on every run, and the entry stored by one run is DISCARDED by the next one
// with this exact sentence in the log:
//
//     Calculating task graph as configuration cache cannot be reused because
//     environment variable 'PIPELINEK_GATE_TMPDIR' has changed.
//
// The cache would then be used by nobody: every run would store an entry that
// the next run throws away, and the gate would pay the price of storing it
// for nothing.
//
// So this script does not read the environment while the build is configured.
// It reads it inside the action, at execution time, where a read has no
// effect on the identity of the entry. When the variable is absent the
// action does nothing, so a build outside the gate keeps the default
// behaviour of the machine.

gradle.projectsLoaded {
    gradle.rootProject.allprojects { project ->
        // configureEach, not each: the task is configured when it exists, so a
        // module that declares its tests later is covered too.
        project.tasks.withType(org.gradle.api.tasks.testing.Test).configureEach { test ->
            test.doFirst {
                // The destination of THIS run. It is read here, at execution
                // time, and not at configuration time, so that a run which
                // reuses a configuration cache entry sends its workers to the
                // directory of the run that is running, and not to the
                // directory of the run that stored the entry.
                def current = System.getenv('PIPELINEK_GATE_TMPDIR')
                if (current != null && !current.isEmpty()) {
                    test.systemProperty 'java.io.tmpdir', current
                }
            }
        }
    }
}
