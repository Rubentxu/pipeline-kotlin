// The overlap clock of the build.
//
// The per-task clock the gate already reads (scripts/gradle-task-timing.init.gradle)
// measures the DURATION of each task and the state it ended in. It does not
// measure WHEN, and from a duration a reader cannot tell whether two tasks ran
// one after another or at the same time. Every question of the shape "how much
// of this overlaps that" therefore needed a NEW throwaway script, and a
// throwaway script answers its question exactly once: the next reader of the
// same question writes the next throwaway script, and nobody can compare the
// two because they measured different things.
//
// One Gradle command line can run SEVERAL builds: an included build of a
// composite is configured and executed inside the same invocation, and each of
// them evaluates this script again. Each build has its own clock origin, so
// the windows of two builds are NOT on the same timeline, and their spans must
// not be added or compared. EVERY line below names the build it
// belongs to, so that a number is never read against the wrong clock.
//
// The contract, one line per fact, with the build id as the FIRST field of
// every line:
//
//     TASK_OVERLAP_BUILD <build id> <root project directory>
//     TASK_WINDOW <build id> <task path> <start ms> <end ms> <duration ms>
//     TASK_OVERLAP_TASKS <build id> <n>
//     TASK_OVERLAP_WINDOW <build id> <first ms> <last ms> <span ms>
//     TASK_OVERLAP_SUM <build id> <ms>
//     TASK_OVERLAP_FACTOR <build id> <hundredths>
//     TASK_OVERLAP_CONCURRENCY <build id> <n>
//
// The build id is the root project name with every character that is not a
// letter, a digit, a dot or a dash replaced by a dash, so that it never
// contains a space and a reader can split a line on spaces without ambiguity.
// The directory travels in the BUILD line, so two builds that happen to share
// a root project name can still be told apart.
//
// The start and the end are milliseconds from an arbitrary but monotonic
// origin, so only their DIFFERENCES mean anything; the origin itself is not
// a time of day and is not comparable between two runs, NOR between two builds
// of the same run. The SPAN is the interval from the first task that started
// to the last task that ended: it is the window the tasks occupied, and the
// time Gradle spent configuring the build is not part of it. A reader who
// wants the whole invocation has the gate's own wall clock, which measures it
// end to end.
//
// TWO OF THESE NUMBERS ARE NOT CLOCKS, and a report that reads them as clocks
// is wrong in a way that always flatters the build:
//
//   TASK_OVERLAP_SUM is the sum of the durations of the tasks, so work that ran
//   in parallel is counted once for every task that did it. It is the WORK, and
//   it is normally LARGER than the span it took. It is not a time.
//   TASK_OVERLAP_FACTOR is that sum divided by the span: the average number of
//   tasks that were running at the same time. A factor of 100 means the tasks
//   ran one after another; a factor of 483 means 4.83 of them ran at once on
//   average. It is a ratio, and the hundredths keep the line an integer.
//
// TASK_OVERLAP_CONCURRENCY is the largest number of tasks that were running at
// the same instant, which is the answer to "did these two overlap" for the
// pair that mattered, without asking the reader to add up intervals by hand.
//
// WHY THE CLOCK IS BUILT ON ACTIONS AND ON A SERVICE, AND NOT ON A LISTENER
//
// This clock used to be a `TaskExecutionListener` with its summary printed
// from `gradle.buildFinished`. Measured on this build (Gradle 8.14.5) with the
// configuration cache enabled, NEITHER fires when the configuration is reused:
// the run that reuses an entry executes the tasks and the listener never hears
// about them. The same measurement found the two mechanisms that DO survive:
// the `doFirst`/`doLast` actions of a task, and the `close()` of a build
// service.
//
// So the windows are actions around the work of each task, and the summary is
// printed by the service when the build ends.
//
// WHY THE IDENTITY OF THE BUILD IS NOT READ WHEN THE SCRIPT IS EVALUATED
//
// The identity of the build could be read when this script is evaluated, or
// when the projects are loaded, and stored in the service. Measured with the
// configuration cache enabled, that identity does NOT survive: Gradle CLOSES
// the build service when it stores the entry, and the execution phase then
// works with a NEW instance of the service whose state was not carried over.
// The identity read at configuration time is therefore gone by the time the
// tasks run, and the summary would name a build that does not exist.
//
// The identity is therefore taken from the TASK, in the action itself: the
// root project of the task names the build, and the root project directory
// locates it. Both are facts of the task that is running, so they are correct
// in the run that stores the entry and in the run that reuses it.
//
// A summary is printed only when there is something to summarize. The build
// that stores the entry closes its service BEFORE any task runs, and that
// close has no windows to report; printing an empty summary for it would
// put a second, hollow block of lines in the log for the same build.
//
// The identity is taken while the build is CONFIGURED, not while it runs,
// because Gradle does not allow a task to ask for its project once the
// configuration cache is on: measured, the attempt is reported as
//
//     invocation of 'Task.project' at execution time is unsupported.
//
// What the action reads is therefore a pair of strings computed here, which
// travel with the action inside the configuration cache entry and are the
// same in the run that stores the entry and in the run that reuses it.

abstract class TaskOverlapService implements org.gradle.api.services.BuildService<TaskOverlapService.Params>, AutoCloseable {
    interface Params extends org.gradle.api.services.BuildServiceParameters {}

    // The identity of the build this service measures, taken from the tasks
    // that run. It is 'unknown-build' until a task of this build says
    // otherwise.
    String buildId = 'unknown-build'
    String buildDir = 'unknown-build'

    // The start of the task that is running RIGHT NOW, by task path. The
    // tasks of a parallel build run on several threads, so the map is
    // synchronized: a map that lost an entry would report a task with no
    // window, and a window that lost a task would report a build as
    // serialized when it was not.
    final java.util.Map<String, Long> startedAt = java.util.Collections.synchronizedMap(new java.util.LinkedHashMap())

    // The windows, as "start,end" pairs in milliseconds from the origin. The
    // list is EMPTY when the configuration cache entry is stored, because the
    // entry is stored before any task runs, and it is filled during the
    // execution.
    final java.util.List<String> windows = java.util.Collections.synchronizedList(new ArrayList())

    // The largest number of tasks that were running at the same instant. The
    // intervals are swept in time order; at the same instant a task that ENDS
    // is counted before a task that STARTS, because a task that ends at t and
    // another that starts at t do not overlap: they touch.
    private static int peakConcurrency(List<List<Long>> wins) {
        if (wins.isEmpty()) {
            return 0
        }
        def events = []
        wins.each { w ->
            events << [w[0] as long, 1]
            events << [w[1] as long, -1]
        }
        events.sort { a, b -> a[0] == b[0] ? (a[1] <=> b[1]) : (a[0] <=> b[0]) }
        int live = 0
        int peak = 0
        events.each { ev ->
            live += ev[1] as int
            if (live > peak) {
                peak = live
            }
        }
        return peak
    }

    @Override
    void close() {
        // The summary of the build, printed when the build ends. A build
        // service is closed at the end of the build it belongs to, and that
        // happens on a run that reuses a configuration cache entry too.
        def wins = []
        windows.each { text ->
            def parts = text.split(',')
            wins << [Long.parseLong(parts[0]), Long.parseLong(parts[1])]
        }
        int n = wins.size()
        if (n == 0) {
            // Nothing ran: there is no overlap to summarize, and a block of
            // zeroes would be read as "this build ran nothing at the same
            // time as anything", which is a different claim.
            return
        }
        long sum = 0L
        long first = Long.MAX_VALUE
        long last = 0L
        wins.each { w ->
            long s = w[0] as long
            long e = w[1] as long
            sum += (e - s)
            if (s < first) {
                first = s
            }
            if (e > last) {
                last = e
            }
        }
        long span = last - first
        println "TASK_OVERLAP_BUILD ${buildId} ${buildDir}"
        println "TASK_OVERLAP_TASKS ${buildId} ${n}"
        println "TASK_OVERLAP_WINDOW ${buildId} ${first} ${last} ${span}"
        println "TASK_OVERLAP_SUM ${buildId} ${sum}"
        if (span > 0) {
            println "TASK_OVERLAP_FACTOR ${buildId} ${Math.round(100.0d * sum / span)}"
        }
        println "TASK_OVERLAP_CONCURRENCY ${buildId} ${peakConcurrency(wins)}"
    }
}

def overlapService = gradle.sharedServices.registerIfAbsent('pipelinekTaskOverlap', TaskOverlapService) {}

// The origin of the clock, read once when this script is evaluated. It is
// arbitrary on purpose: only the differences between the readings mean
// anything, and an origin that depends on WHEN the listener happened to be
// registered would make two runs of the same build incomparable. A run that
// REUSES an entry did not evaluate this script, so it keeps the origin of the
// run that stored the entry: the absolute numbers of such a run are therefore
// not comparable with the numbers of another run, which is exactly what the
// contract above says about the origin.
def originNs = System.nanoTime()

gradle.allprojects { project ->
    // The identity of the build, resolved while the build is configured. The
    // root project of the project being configured names the build, and its
    // directory locates it.
    def buildId = project.rootProject.name.replaceAll('[^A-Za-z0-9.-]+', '-')
    def buildDir = project.rootProject.projectDir.absolutePath
    project.tasks.configureEach { task ->
        task.doFirst {
            def service = overlapService.get()
            // The identity of the build, taken from the configuration of the
            // task that is about to run. It is written on every task because
            // the service that runs the tasks is not always the one that was
            // configured.
            service.buildId = buildId
            service.buildDir = buildDir
            service.startedAt[task.path] = System.nanoTime()
        }
        task.doLast {
            def service = overlapService.get()
            def began = service.startedAt.remove(task.path)
            if (began == null) {
                return
            }
            // Integer division on purpose: the contract says milliseconds, and
            // a fractional millisecond is a digit the reader would have to know
            // how to read.
            long s = (began - originNs).intdiv(1000000L)
            long e = (System.nanoTime() - originNs).intdiv(1000000L)
            service.windows.add("${s},${e}")
            println "TASK_WINDOW ${service.buildId} ${task.path} ${s} ${e} ${e - s}"
        }
    }
}
