// The overlap clock of the build.
//
// The per-task clock the gate already reads (scripts/gradle-task-timing.init.gradle)
// measures the DURATION of each task and the state it ended in. It does not
// measure WHEN, and from a duration a reader cannot tell whether two tasks ran
// one after another or at the same time. Every question of the shape "how much
// of this overlaps that" therefore needed a NEW throwaway script, and a
// throwaway script answers its question exactly once: the next reader of the
// same question writes the next throwaway script, and nobody can compare the
// two because they measured different things.
//
// One Gradle command line can run SEVERAL builds: an included build of a
// composite is configured and executed inside the same invocation, and each of
// them evaluates this script again. Each build has its own clock origin, so
// the windows of two builds are NOT on the same timeline, and their spans must
// not be added or compared. EVERY line below therefore names the build it
// belongs to, so that a number is never read against the wrong clock.
//
// The contract, one line per fact, with the build id as the FIRST field of
// every line:
//
//     TASK_OVERLAP_BUILD <build id> <root project directory>
//     TASK_WINDOW <build id> <task path> <start ms> <end ms> <duration ms>
//     TASK_OVERLAP_TASKS <build id> <n>
//     TASK_OVERLAP_WINDOW <build id> <first ms> <last ms> <span ms>
//     TASK_OVERLAP_SUM <build id> <ms>
//     TASK_OVERLAP_FACTOR <build id> <hundredths>
//     TASK_OVERLAP_CONCURRENCY <build id> <n>
//
// The build id is the root project name with every character that is not a
// letter, a digit, a dot or a dash replaced by a dash, so that it never
// contains a space and a reader can split a line on spaces without ambiguity.
// The directory travels in the BUILD line, so two builds that happen to share
// a root project name can still be told apart.
//
// The start and the end are milliseconds from an arbitrary but monotonic
// origin, so only their DIFFERENCES mean anything; the origin itself is not a
// time of day and is not comparable between two runs, NOR between two builds
// of the same run. The SPAN is the interval from the first task that started
// to the last task that ended: it is the window the tasks occupied, and the
// time Gradle spent configuring the build is not part of it. A reader who
// wants the whole invocation has the gate's own wall clock, which measures it
// end to end.
//
// TWO OF THESE NUMBERS ARE NOT CLOCKS, and a report that reads them as clocks
// is wrong in a way that always flatters the build:
//
//   TASK_OVERLAP_SUM is the sum of the durations of the tasks, so work that ran
//   in parallel is counted once for every task that did it. It is the WORK, and
//   it is normally LARGER than the span it took. It is not a time.
//   TASK_OVERLAP_FACTOR is that sum divided by the span: the average number of
//   tasks that were running at the same time. A factor of 100 means the tasks
//   ran one after another; a factor of 483 means 4.83 of them ran at once on
//   average. It is a ratio, and the hundredths keep the line an integer.
//
// TASK_OVERLAP_CONCURRENCY is the largest number of tasks that were running at
// the same instant, which is the answer to "did these two overlap" for the
// pair that mattered, without asking the reader to add up intervals by hand.
//
// The window is measured with the same monotonic clock for every task of a
// build, so the intervals are comparable with each other. The clock is read at
// the start and at the end of each task, and the listener adds no work of its
// own to the build it measures.

import org.gradle.api.execution.TaskExecutionListener
import org.gradle.api.tasks.TaskState

// The tasks of a parallel build are started and finished on several threads,
// so the bookkeeping below is synchronized. A map that lost an entry would
// report a task with no window, and a window that lost a task would report a
// build as serialized when it was not.
def startedAt = java.util.Collections.synchronizedMap(new java.util.LinkedHashMap())
def windows = java.util.Collections.synchronizedList(new ArrayList())
def taskCount = new java.util.concurrent.atomic.AtomicInteger(0)
def sumMs = new java.util.concurrent.atomic.AtomicLong(0L)
def firstStartMs = new java.util.concurrent.atomic.AtomicLong(Long.MAX_VALUE)
def lastEndMs = new java.util.concurrent.atomic.AtomicLong(0L)

// The origin of the clock, read once when this script is evaluated. It is
// arbitrary on purpose: only the differences between the readings mean
// anything, and an origin that depends on WHEN the listener happened to be
// registered would make two runs of the same build incomparable.
def originNs = System.nanoTime()

// The identity of the build this script is measuring. An included build of a
// composite evaluates this script again and gets its own clock, so the reader
// is told which build each set of numbers belongs to.
//
// The root project does not exist yet while this script is being evaluated:
// an init script runs BEFORE the settings of the build are read. The identity
// is therefore resolved when the task graph is ready, which is before any
// task of this build has started.
def buildId = 'unknown-build'
def buildDir = 'unknown-build'
gradle.taskGraph.whenReady { graph ->
    buildId = gradle.rootProject.name.replaceAll('[^A-Za-z0-9.-]+', '-')
    buildDir = gradle.rootProject.projectDir.absolutePath
}

// The largest number of tasks that were running at the same instant. The
// intervals are swept in time order; at the same instant a task that ENDS is
// counted before a task that STARTS, because a task that ends at t and
// another that starts at t do not overlap: they touch.
def peakConcurrency = { List wins ->
    if (wins.isEmpty()) {
        return 0
    }
    def events = []
    wins.each { w ->
        events << [w[0] as long, 1]
        events << [w[1] as long, -1]
    }
    events.sort { a, b -> a[0] == b[0] ? (a[1] <=> b[1]) : (a[0] <=> b[0]) }
    int live = 0
    int peak = 0
    events.each { ev ->
        live += ev[1] as int
        if (live > peak) {
            peak = live
        }
    }
    return peak
}

gradle.taskGraph.addTaskExecutionListener(new TaskExecutionListener() {
    @Override
    void beforeExecute(org.gradle.api.Task task) {
        startedAt[task.path] = System.nanoTime()
    }

    @Override
    void afterExecute(org.gradle.api.Task task, TaskState state) {
        def began = startedAt.remove(task.path)
        if (began == null) {
            return
        }
        // Integer division on purpose: the contract says milliseconds, and a
        // fractional millisecond is a digit the reader would have to know how
        // to read.
        long s = (began - originNs).intdiv(1000000L)
        long e = (System.nanoTime() - originNs).intdiv(1000000L)
        taskCount.incrementAndGet()
        sumMs.addAndGet(e - s)
        firstStartMs.accumulateAndGet(s, { a, b -> a < b ? a : b })
        lastEndMs.accumulateAndGet(e, { a, b -> a > b ? a : b })
        windows.add([s, e])
        println "TASK_WINDOW ${buildId} ${task.path} ${s} ${e} ${e - s}"
    }
})

gradle.buildFinished {
    int n = taskCount.get()
    long first = firstStartMs.get() == Long.MAX_VALUE ? 0L : firstStartMs.get()
    long last = lastEndMs.get()
    long span = last - first
    long sum = sumMs.get()
    println "TASK_OVERLAP_BUILD ${buildId} ${buildDir}"
    println "TASK_OVERLAP_TASKS ${buildId} ${n}"
    println "TASK_OVERLAP_WINDOW ${buildId} ${first} ${last} ${span}"
    println "TASK_OVERLAP_SUM ${buildId} ${sum}"
    if (span > 0) {
        println "TASK_OVERLAP_FACTOR ${buildId} ${Math.round(100.0d * sum / span)}"
    }
    println "TASK_OVERLAP_CONCURRENCY ${buildId} ${peakConcurrency(windows)}"
}
