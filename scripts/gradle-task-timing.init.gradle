// The per-task clock of the build.
//
// One Gradle invocation in this repository carries several different works:
// the compilation of the modules, the static analysis, the public-API check
// and the assembly of the distribution. The stage log keeps ONE clock for
// all of them, and a reader cannot tell which of them the time went to. This
// clock turns that single number into one line per task, so the gate can
// report the cost of each part instead of a figure it cannot spend.
//
// The line is a contract with the gate:
//
//     TASK_TIMING <task path> <milliseconds> <state>
//
// The state is a single word with no spaces, so the gate can read the line
// without knowing which state a task ended in. The gate counts the lines it
// can attribute, and refuses to report a cost for a part it never measured.
//
// WHY THE CLOCK IS BUILT ON ACTIONS, AND NOT ON A LISTENER
//
// This clock used to be a `TaskExecutionListener`. Measured on this build
// (Gradle 8.14.5) with the configuration cache enabled, a listener registered
// on the task graph does NOT fire when the configuration is reused: the run
// that reuses an entry executes the tasks and the listener never hears about
// them. The same measurement found the two mechanisms that DO survive: the
// `doFirst`/`doLast` actions of a task, and the `close()` of a build service.
//
// So the clock is now an ACTION pair around the work of each task, and the
// state travels WITH the clock. A task that was up to date, or that was
// served from the cache, never runs its actions, so the clock does not see it
// -- and that is not a gap: the state of a free task is declared by Gradle
// itself, in its console, and the gate reads it from there. One owner per
// fact: Gradle says WHICH tasks ran, this clock says HOW LONG they took.
//
// The start instant is kept in a build service instead of in a variable of
// this script, because a variable captured by the two actions is not
// guaranteed to be the same variable once the actions are serialized into a
// configuration cache entry and read back. A build service is the mechanism
// Gradle provides for sharing state between the actions of a build, and it
// survives the cache by construction.

import org.gradle.api.tasks.TaskState

abstract class TaskTimingService implements org.gradle.api.services.BuildService<TaskTimingService.Params>, AutoCloseable {
    interface Params extends org.gradle.api.services.BuildServiceParameters {}

    // The start of the task that is running RIGHT NOW, by task path. The
    // tasks of a parallel build run on several threads, so the map is
    // synchronized: a map that lost an entry would report a task with no
    // duration at all.
    final java.util.Map<String, Long> startedAt = java.util.Collections.synchronizedMap(new java.util.LinkedHashMap())

    @Override
    void close() {
        // Nothing to close. The clock prints one line per task as the task
        // ends, and the gate reads those lines.
    }
}

def timingService = gradle.sharedServices.registerIfAbsent('pipelinekTaskTiming', TaskTimingService) {}

gradle.allprojects { project ->
    project.tasks.configureEach { task ->
        task.doFirst {
            timingService.get().startedAt[task.path] = System.nanoTime()
        }
        task.doLast {
            def began = timingService.get().startedAt.remove(task.path)
            if (began == null) {
                return
            }
            // Integer division on purpose: the contract says milliseconds, and
            // a fractional millisecond is a digit the gate would have to know
            // how to read.
            long millis = (System.nanoTime() - began).intdiv(1000000L)
            // A task that reaches this point RAN its work. The state of a task
            // that did not run is not written here: it is declared by Gradle
            // in its console, and the gate reads it from there.
            println "TASK_TIMING ${task.path} ${millis} EXECUTED"
        }
    }
}
