# The key that signs the Maven artifacts.
#
# A DIFFERENT key from the one that signs the release tags, and on purpose.
# The tag that names a release and the JAR that any third party downloads are
# two trust domains, and their revocations are two: compromising the key that
# signs the tags would leave every published artifact unsigned, and
# compromising the key that signs the artifacts would leave every release tag
# unattributable. One key pair would bind both domains into one, and then one
# revocation would reach the other.
#
# The shape is the shape of scripts/release/signing-key.conf, and the reader
# is the same reader: scripts/release/read-signing-trust.sh. One reader per
# format is the rule, and two facts that are not the same fact do not need two
# readers.
#
# What these keys prove, and what they do not:
#   they PROVE possession of the private key, so the artifact was signed by
#   whoever holds it;
#   they do NOT prove by themselves that whoever holds them owns this
#   repository. The binding is the DECLARATION this repository versions: the
#   fingerprint and the uid below are published to the consumers in
#   RELEASE-SIGNING.md, and the publisher is the holder of the private key of
#   the key that declaration names.
#
# The uid below is what the key CLAIMS. It is compared with the uid the
# signature carries, so a key whose identity changed is a key somebody else
# should look at. A uid is a claim and never an attribution: nobody can be
# attributed by the string their key carries.
#
# The trust channel of a consumer is THIS REPOSITORY: the fingerprint and the
# uid declared here, and the same fingerprint published to the consumers in
# RELEASE-SIGNING.md. The private key never leaves the keyring, and the
# account that hosts the repository is TRANSPORT and nothing more: what its
# database says about a key is a fact about that database, and nothing in this
# repository depends on it.

# The key that signs the artifacts of the Maven bundle.
fingerprint=965464FFF6496FAFCC62F49644E527FF58783108
uid=PipelineK Maven Artifacts <rubentxu74@gmail.com>

# The keys that signed the artifacts already published, one per line:
#   retired=<fingerprint>|<uid>
# The fingerprint is the first field; the uid is everything after the first
# separator, so a uid that carries spaces survives.
#
# The group is empty: the key above is the one that signed the artifacts of
# 0.94.2, which are published in both remote channels, and no other key has
# signed an artifact. A rotation that dropped the current key would turn every
# artifact ever published into a signature nobody can verify, which is the
# opposite of what a rotation is for.
