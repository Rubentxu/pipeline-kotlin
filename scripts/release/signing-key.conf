# The key that signs PipelineK release tags.
#
# One fingerprint, one uid. The release path refuses to sign with any other
# key, and the check that reads the signature refuses a signature that does not
# come from this fingerprint. Rotating the key is therefore a reviewed change to
# this file, not a change to somebody's local git config.
#
# The fingerprint is declared HERE and not in a local git config on purpose: a
# config value is invisible to review, and a signature that verifies against
# whatever key the machine happened to hold proves nothing about the publisher.
#
# What this key proves, and what it does not:
#   it PROVES possession of the private key, so the tag was signed by whoever
#   holds it;
#   it does NOT prove that whoever holds it owns this repository. That binding
#   is established outside the repository, and until it is, a consumer reading
#   the signature must treat the publisher as UNATTRIBUTED.
#
# The uid below is what the key CLAIMS. It is compared with the uid the
# signature carries, so a key whose identity changed is a key somebody else
# should look at.

fingerprint=9600F7D49B9C966E3BB04E6A17E44CA7C5288281
uid=test@example.com
