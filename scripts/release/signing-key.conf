# The keys that sign PipelineK release tags.
#
# One CURRENT key, and the keys that signed the tags ALREADY published.
#
# Why a set and not one key. The current key signs the tags this repository
# cuts from now on. The other keys signed the tags that are already out there,
# and those signatures keep verifying: a published tag is a fact, and a key
# that stops signing does not un-sign what it already signed. A rotation that
# dropped the previous key would turn every release ever published into a tag
# nobody can verify, which is the opposite of what a rotation is for.
#
# The current fingerprint is declared HERE and not in a local git config on
# purpose: a config value is invisible to review, and a signature that
# verifies against whatever key the machine happened to hold proves nothing
# about the publisher.
#
# What these keys prove, and what they do not:
#   they PROVE possession of the private key, so the tag was signed by whoever
#   holds it;
#   they do NOT prove that whoever holds them owns this repository. That
#   binding is established outside the repository, and until it is, a consumer
#   reading the signature must treat the publisher as UNATTRIBUTED.
#
# The uid below is what the key CLAIMS. It is compared with the uid the
# signature carries, so a key whose identity changed is a key somebody else
# should look at. A uid is a claim and never an attribution: nobody can be
# attributed by the string their key carries.
#
# The current key claims an address that a channel outside this repository can
# corroborate. The address `example.com` and the other domains reserved for
# documentation cannot be corroborated by anybody, so a key claiming one can
# never receive an attribution, and scripts/check-signing-key-trust.py refuses
# it while it is the current key.
#
# The trust channel of a consumer is OUTSIDE this repository: it is the
# account that owns the repository, and the GPG keys that account registers.
# A key registered there is one the publishing account vouches for, and a key
# that is not registered there is one nobody vouches for.
# RELEASE-SIGNING.md writes the review down, and
# scripts/release/verify-signing-key-attribution.sh measures it.

# The key that signs the new tags.
fingerprint=980C8E16562A797BABDC76161135ACC699A41110
uid=Ruben <rubentxu74@gmail.com>

# The keys that signed the tags already published, one per line:
#   retired=<fingerprint>|<uid>
# The fingerprint is the first field; the uid is everything after the first
# separator, so a uid that carries spaces survives.
#
# The key below signed the releases published under the tags from v0.90.0-rc3
# to v0.92.0-rc1. Its uid claims a domain reserved for documentation, so it
# can never be corroborated, and it is not the current key: it signs nothing
# new.
