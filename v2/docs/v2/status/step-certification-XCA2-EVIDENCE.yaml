# XCA-2 — Step Certification Evidence Ledger
# Authority: XCA-2 gate (runtime evidence), workstream D
# Verification status progression:
#   CURRENT_STEP    — active implementation/test work
#   STATIC_CANDIDATE — source-only analysis; no runtime evidence
#   EVIDENCE_READY  — runtime evidence collected; reconciliation pending
#   CERTIFIED        — evidence reconciled, all expectations matched
#   QUARANTINED      — evidence collected but reconciliation failed
#   RETIRED          — step removed from registry
#
# Evidence schema per entry:
#   verification_status: <status>
#   provenance:
#     fixture_id:      <file>            # fixture that exercises this step
#     run_id:          <uuid> | null     # null if not yet executed
#     timestamp:       <ISO-8601> | null
#     journal_db_path:  <path> | null
#     is_replayed:     <bool>
#   reconciliation:
#     matched:                  <n> | null
#     expected_but_not_executed: <n> | null
#     extra_observed:           <n> | null
#     is_fully_covered:         <bool> | null
#   step_expectations:
#     <step_key>: <HasEvidence | NoEvidence | ExecutionFailed>

steps:

  # ───────────────────────────────────────────────────────────────────────────
  # core.echo — atomic, no effects
  # Evidence: XCA-2B real run (runId: 006df865-a1d4-4bcf-ac8c-895c0864ea60)
  #
  # VERIFY-2026-09-17 demotion: CERTIFIED → IMPLEMENTED_UNCERTIFIED.
  #
  # The XCA-2B run produced real evidence (3 echo invocations, all SUCCEEDED,
  # matched against the 03-stages fixture's expected {core.echo}×3). The
  # Step Constitution burn-down (ADR-0074) defines CERTIFIED as the FINAL
  # state of the G0..G8 burn-down sequence — it is NOT a state an apply
  # commit can self-declare. The official Step Constitution ledger at
  # docs/v2/status/step-certification.yaml tracks CERTIFIED with full G0..G8
  # receipts (S3_ECHO_BURNDOWN_CERTIFICATION.md). The XCA-2 evidence ledger
  # is a DIFFERENT authority — its CERTIFIED semantic would mean "XCA-2
  # evidence reconciliation passed", which it did, but that is not the
  # canonical certification that the rest of the project reads.
  #
  # Until XCA-2 defines its own G0..G8 certifier distinct from Step
  # Constitution, this entry stays at IMPLEMENTED_UNCERTIFIED. The evidence
  # below is preserved verbatim so the reconciliation can be re-run.
  # ───────────────────────────────────────────────────────────────────────────
  core.echo:
    verification_status: IMPLEMENTED_UNCERTIFIED
    provenance:
      fixture_id: "compatibility/03-stages.pipeline.kts"
      run_id: "006df865-a1d4-4bcf-ac8c-895c0864ea60"
      timestamp: "2026-09-16T15:30:00Z"       # from XCA-2B receipt
      journal_db_path: "/tmp/xca2b/run.db"
      is_replayed: false
    reconciliation:
      matched: 3
      expected_but_not_executed: 0
      extra_observed: 0
      is_fully_covered: true
    step_expectations:
      core.echo: HasEvidence
    notes: |
      DEMOTED (verify 2026-09-17): CERTIFIED requires the Step Constitution
      burn-down certifier (G0..G8, ADR-0074). This XCA-2 entry only recorded
      evidence reconciliation, which is a prerequisite of CERTIFICATION, not
      certification itself. Promoting to CERTIFIED requires an explicit
      XCA-2 certifier run that:
        (a) re-runs the corpus against an isolated journal,
        (b) verifies the reconciliation against a fixed oracle,
        (c) signs the result with an XCA-2 certifier key (TBD),
        (d) updates both this ledger and the official Step Constitution
            ledger at docs/v2/status/step-certification.yaml.
      Until then, the evidence is preserved under IMPLEMENTED_UNCERTIFIED
      with full provenance so the reconciliation is reproducible.

      03-stages fixture: build (echo "building..."), test (echo "testing..."),
      deploy (echo "deploying...").  Three echo invocations in three stages.
      All three observed via JournalRunExecutionEvidenceReader against real
      SqliteOperationJournalImpl. Reconciled: E∩O = {core.echo}×3, E−O = ∅.

  # ───────────────────────────────────────────────────────────────────────────
  # core.pwd — effectful (filesystem), STOPPED_G7 not certifiable
  # Evidence: XCA-2B corpus run; STOPPED_G7 is pending (B.5)
