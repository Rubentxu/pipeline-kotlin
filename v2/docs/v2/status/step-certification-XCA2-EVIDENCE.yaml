    notes: |
      STOPPED_G7 (core.pwd certification) requires all three pwd(tmp=true),
      pwd(tmp=false), pwd() variants exercised. B.5 confirms evidence IS
      produced (journal reader detects invocations) but STOPPED_G7 is not
      yet certified. Move to CERTIFIED once all three pwd variants have
      individual reconciliation evidence.

