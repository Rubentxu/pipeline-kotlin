# XCA-2 — Step Certification Evidence Ledger
# Authority: XCA-2 gate (runtime evidence), workstream D
# Verification status progression:
#   CURRENT_STEP    — active implementation/test work
#   STATIC_CANDIDATE — source-only analysis; no runtime evidence
#   EVIDENCE_READY  — runtime evidence collected; reconciliation pending
#   CERTIFIED        — evidence reconciled, all expectations matched
#   QUARANTINED      — evidence collected but reconciliation failed
#   RETIRED          — step removed from registry
#
# Evidence schema per entry:
#   verification_status: <status>
#   provenance:
#     fixture_id:      <file>            # fixture that exercises this step
#     run_id:          <uuid> | null     # null if not yet executed
#     timestamp:       <ISO-8601> | null
#     journal_db_path:  <path> | null
#     is_replayed:     <bool>
#   reconciliation:
#     matched:                  <n> | null
#     expected_but_not_executed: <n> | null
#     extra_observed:           <n> | null
#     is_fully_covered:         <bool> | null
#   step_expectations:
#     <step_key>: <HasEvidence | NoEvidence | ExecutionFailed>

steps:

