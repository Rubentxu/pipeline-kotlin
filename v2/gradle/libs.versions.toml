[versions]
kotlin = "2.4.10"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.11.0"
junit = "5.11.4"
junitLauncher = "1.11.4"
protobuf = "3.25.5"
protobufPlugin = "0.9.4"
cyclonedx = "1.8.2"

# BouncyCastle (credentials-local module only - ADR-0049 D2)
# NOTE: bcprov-jdk18on is the correct artifact (NOT bcprov-jdk21on which does not exist)
# 1.86: clears GHSA-wg6q-6289-32hp (bcpkix CompositeVerifier, fixed 1.84) and the three
# bcprov advisories osv-scanner flagged against 1.80.2; 1.86 is the hardening release.
bouncycastle = "1.86"
# Used ONLY for AntPathMatcher in pipeline-artefacts-local (single-class usage; removal
# tracked as backlog). 6.2.19 clears GHSA-jmp9-x22r-554x (fixed 6.2.11) and
# GHSA-659m-px2c-25wj / CVE-2026-41848 ReDoS in AntPathMatcher (fixed 6.2.19) — relevant
# because artifact excludes patterns are user-supplied.
spring-core = "6.2.19"
snakeyaml = "2.3"
# C5 / D-011 (audit 2026-09-26, R7): binary-compatibility-validator captures the
# JVM ABI of public Kotlin types. Phased rollout: opt-in modules first (Phase 1,
# 2026-09-26) — pipeline-domain / pipeline-events / pipeline-step-sdk:api /
# pipeline-credentials-api. NOT wired into `check` yet — Phase 2 (post-C1 file
# partition) regenerates baselines and gates the ABI in CI. 0.18.2 supports
# Kotlin 2.4.x metadata.
binaryCompatibilityValidator = "0.18.2"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version = "3.53.4.0" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitLauncher" }
kotlin-scripting-common = { module = "org.jetbrains.kotlin:kotlin-scripting-common", version.ref = "kotlin" }
kotlin-scripting-jvm-host = { module = "org.jetbrains.kotlin:kotlin-scripting-jvm-host", version.ref = "kotlin" }
kotlin-scripting-jvm = { module = "org.jetbrains.kotlin:kotlin-scripting-jvm", version.ref = "kotlin" }
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
protobuf-kotlin-lite = { module = "com.google.protobuf:protobuf-kotlin-lite", version.ref = "protobuf" }
protobuf-protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
# BouncyCastle (credentials-local module only - ADR-0049 D2)
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }
spring-core = { module = "org.springframework:spring-core", version.ref = "spring-core" }

[bundles]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinxSerialization" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
# WU-RP-040 R1: coverage (Kover). Version must stay compatible with kotlin 2.4.x toolchain.
kover = { id = "org.jetbrains.kotlinx.kover", version = "0.9.9" }
# WU-RP-040 R5: SAST (detekt). 2.0.0-alpha.6 is built against Kotlin 2.4.10 (same as this
# toolchain); 1.23.x cannot parse class-file major 68 (JDK24) — precedent: pitest 1.15 -> 1.19.
detekt = { id = "dev.detekt", version = "2.0.0-alpha.6" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
# C5 / D-011: ABI baseline capture. See version note above.
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
