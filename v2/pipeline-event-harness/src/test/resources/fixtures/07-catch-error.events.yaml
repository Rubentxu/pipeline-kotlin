version: 1
name: 07-catch-error
expect:
  runOutcome: UNSTABLE
constraints:
  - exactly: { event: CatchErrorTriggered, where: { buildResult: FAILURE }, count: 1 }
  - exactly: { event: CatchErrorTriggered, where: { buildResult: UNSTABLE }, count: 1 }
  - before:
      first: { event: CatchErrorTriggered, where: { buildResult: FAILURE } }
      second: { event: CatchErrorTriggered, where: { buildResult: UNSTABLE } }
  - exactly: { event: EchoOutputCaptured, where: { messageContains: "continues after nested catch" }, count: 1 }
