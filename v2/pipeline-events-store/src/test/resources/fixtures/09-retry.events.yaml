version: 1
name: 09-retry
expect:
  runOutcome: SUCCESS
constraints:
  - exactly: { event: RetryAttemptFinished, where: { retryOutcome: failed }, count: 1 }
  - exactly: { event: RetryAttemptFinished, where: { retryOutcome: succeeded }, count: 1 }
  - before:
      first: { event: RetryAttemptFinished, where: { retryOutcome: failed } }
      second: { event: RetryAttemptFinished, where: { retryOutcome: succeeded } }
