version: 1
name: 10-timeout
expect:
  runOutcome: FAILURE
constraints:
  - exactly: { event: TimeoutScheduled, count: 1 }
  - exactly: { event: StepFailed, where: { messageContains: "timed out" }, count: 1 }
  - before:
      first: { event: TimeoutScheduled }
      second: { event: StepFailed, where: { messageContains: "timed out" } }
